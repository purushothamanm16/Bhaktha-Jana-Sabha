{% extends "base.html" %}
{% block title %}New Entry{% endblock %}
{% block content %}
<main class="wrap narrow">
  <section class="card" aria-labelledby="entry-title">
    <div class="card-head">
      <h1 id="entry-title">New Transaction</h1>
      <img class="divider" src="/static/images/divider.svg" alt="" width="240" height="24">
    </div>

    <form id="tx-form" novalidate>
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" maxlength="100" autocomplete="off">
        <p class="field-error" data-for="name"></p>
      </div>

      <div class="field">
        <label for="amount">Amount</label>
        <div class="input-prefix">
          <span aria-hidden="true">₹</span>
          <input id="amount" name="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00">
        </div>
        <p class="field-error" data-for="amount"></p>
      </div>

      <div class="field">
        <span class="label" id="type-label">Transaction Type</span>
        <div class="type-toggle" id="type-toggle" role="group" aria-labelledby="type-label">
          <button type="button" class="type-btn credit" data-type="credit" aria-pressed="false">Credit</button>
          <button type="button" class="type-btn debit" data-type="debit" aria-pressed="false">Debit</button>
        </div>
        <p class="field-error" data-for="type"></p>
      </div>

      <div class="field">
        <label for="description">Description <span class="optional">(optional)</span></label>
        <textarea id="description" name="description" rows="3" maxlength="500"></textarea>
        <p class="field-error" data-for="description"></p>
      </div>

      <div class="form-error" id="form-error" role="alert" hidden></div>

      <button type="submit" class="btn-gold" id="submit-btn">Submit</button>
    </form>
  </section>

  <p class="hint"><a href="/transactions">View recent transactions &rarr;</a></p>
</main>
{% endblock %}
{% block scripts %}<script src="/static/js/app.js?v=1"></script>{% endblock %}
