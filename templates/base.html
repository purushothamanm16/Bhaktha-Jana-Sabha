<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0806">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}{% endblock %} · Manikandan Bhaktha Jana Sabha</title>
  <link rel="icon" type="image/svg+xml" href="/static/images/lamp.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/css/style.css?v=5">
</head>
<body data-page="{{ page or 'login' }}">
  <div class="bg bg-glow"></div>
  <div class="bg bg-lattice"></div>
  <img class="bg bg-mandala" src="/static/images/mandala.svg" alt="">

  <div class="site">
    {% if page %}
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="/">
          <img src="/static/images/lamp.svg" alt="" width="40" height="40">
          <span class="brand-name">Manikandan Bhaktha Jana Sabha</span>
        </a>
        <nav class="nav" aria-label="Main">
          <a href="/" class="nav-link {% if page == 'dashboard' %}active{% endif %}">New Entry</a>
          <a href="/transactions" class="nav-link {% if page == 'transactions' %}active{% endif %}">Recent Transactions</a>
          {% if sheet_url %}<a href="{{ sheet_url }}" target="_blank" rel="noopener noreferrer" class="nav-link sheet-link">Open Spreadsheet &#8599;</a>{% endif %}
          <form method="post" action="/logout"><button type="submit" class="nav-link logout">Logout</button></form>
        </nav>
      </div>
    </header>
    {% endif %}
    {% block content %}{% endblock %}
  </div>

  <div id="toasts" aria-live="polite" aria-atomic="false"></div>
  {% block scripts %}{% endblock %}
</body>
</html>
